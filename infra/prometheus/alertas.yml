# Umbrales iniciales (segunda entrega, sección 9.2); se ajustan con datos reales de uso.
groups:
  - name: reservas
    rules:
      - alert: ReservasErroresAltos
        expr: sum(rate(reservas_http_requests_total{estado=~"5.."}[5m])) / sum(rate(reservas_http_requests_total[5m])) > 0.02
        for: 5m
        annotations:
          resumen: "Más de 2% de errores 5xx en Reservas durante 5 minutos"

      - alert: ReservasLatenciaAlta
        expr: histogram_quantile(0.95, sum(rate(reservas_http_request_duration_seconds_bucket{metodo="POST",ruta="/reservas"}[5m])) by (le)) > 0.8
        for: 5m
        annotations:
          resumen: "p95 de POST /reservas mayor a 800 ms durante 5 minutos"

      - alert: ReservasOutboxAcumulado
        expr: reservas_outbox_pendientes > 100
        for: 2m
        annotations:
          resumen: "Hay más de 100 eventos sin publicar: RabbitMQ caído o el publicador detenido"

      - alert: ReservasExpiracionesAnomalas
        expr: increase(reservas_expiradas_total[1h]) / increase(reservas_creadas_total[1h]) > 0.3
        for: 5m
        annotations:
          resumen: "Más de 30% de las reservas de la última hora expiraron: posible problema con Pagos"

  - name: pagos
    rules:
      - alert: PagosErroresAltos
        expr: sum(rate(pagos_http_requests_total{estado=~"5.."}[5m])) / sum(rate(pagos_http_requests_total[5m])) > 0.02
        for: 5m
        annotations:
          resumen: "Más de 2% de errores 5xx en Pagos durante 5 minutos"

      - alert: PagosOutboxAcumulado
        expr: pagos_outbox_pendientes > 100
        for: 2m
        annotations:
          resumen: "Pagos tiene más de 100 eventos sin publicar: RabbitMQ caído o el publicador detenido"

      - alert: PagosReembolsosConError
        expr: increase(pagos_reembolsos_total{resultado="error"}[10m]) > 3
        for: 5m
        annotations:
          resumen: "Fallan los reembolsos: hay personas con plata cobrada que no se está devolviendo"

  - name: cocheras
    rules:
      - alert: CocherasErroresInternos
        expr: sum(rate(cocheras_graphql_operaciones_total{resultado="error_interno"}[5m])) / sum(rate(cocheras_graphql_operaciones_total[5m])) > 0.02
        for: 5m
        annotations:
          resumen: "Más de 2% de operaciones GraphQL de Cocheras con error interno durante 5 minutos"

      - alert: CocherasBusquedaLenta
        expr: histogram_quantile(0.95, sum(rate(cocheras_graphql_duracion_seconds_bucket{operacion="buscarCocheras"}[5m])) by (le)) > 0.5
        for: 5m
        annotations:
          resumen: "p95 de buscarCocheras mayor a 500 ms durante 5 minutos"

      - alert: CocherasSinRabbitMQ
        expr: cocheras_rabbitmq_conectado == 0
        for: 1m
        annotations:
          resumen: "Cocheras no está consumiendo eventos: las direcciones no se habilitan al confirmar reservas"

      - alert: CocherasNoLlegaAReservas
        expr: sum(rate(cocheras_consultas_reservas_total{resultado="error"}[5m])) > 0
        for: 5m
        annotations:
          resumen: "Cocheras no puede consultar la ocupación en Reservas: la búsqueda no filtra cocheras ocupadas"

  - name: usuarios
    rules:
      - alert: UsuariosErroresAltos
        expr: sum(rate(usuarios_http_requests_total{estado=~"5.."}[5m])) / sum(rate(usuarios_http_requests_total[5m])) > 0.02
        for: 5m
        annotations:
          resumen: "Más de 2% de errores 5xx en Usuarios durante 5 minutos"

      # Login y refresh: si se ponen lentos nadie puede entrar ni renovar la sesión, y el front
      # refresca el access token cada 15 minutos. bcrypt hace que un login tarde unos 100 ms;
      # medio segundo de p95 ya es anormal (base lenta o CPU saturada).
      - alert: UsuariosSesionLenta
        expr: histogram_quantile(0.95, sum by (le) (rate(usuarios_http_request_duration_seconds_bucket{metodo="POST",ruta=~"/auth/(login|refresh)"}[5m]))) > 0.5
        for: 5m
        annotations:
          resumen: "p95 de login y refresh mayor a 500 ms durante 5 minutos: entrar y renovar la sesión se vuelve lento"

      - alert: UsuariosPosibleFuerzaBruta
        expr: sum(increase(usuarios_logins_total{resultado="fallido"}[5m])) > 30
        for: 1m
        annotations:
          resumen: "Más de 30 logins fallidos en 5 minutos: posible ataque de fuerza bruta"

      # Un refresh token ya usado volvió a aparecer fuera de la ventana de gracia: Usuarios ya
      # cerró todas las sesiones de esa persona, pero alguien tenía su token.
      - alert: UsuariosRefreshReutilizado
        expr: sum(increase(usuarios_refresh_total{resultado="reutilizado"}[10m])) > 0
        annotations:
          resumen: "Se reutilizó un refresh token: posible sesión robada"

  - name: infraestructura
    rules:
      - alert: ServicioCaido
        expr: up == 0
        for: 1m
        annotations:
          resumen: "Prometheus no puede leer las métricas de {{ $labels.job }}"

      - alert: EventosEnDLQ
        expr: sum(rabbitmq_detailed_queue_messages{queue="cocheras.dlq"}) > 0
        for: 1m
        annotations:
          resumen: "Hay mensajes en cocheras.dlq: algún consumidor no pudo procesar eventos"
