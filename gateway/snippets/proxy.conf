# Headers comunes hacia los servicios. Se incluye en cada location que hace proxy_pass porque
# nginx no hereda proxy_set_header de un nivel a otro si el location define alguno propio.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header traceparent $traceparent;

# Identidad: sale solo del JWT validado (ver jwt.js). En rutas públicas, o sin token, queda
# vacía; en ningún caso se usa lo que mande el cliente.
proxy_set_header X-User-Id $usuario_id;
proxy_set_header X-User-Roles $usuario_roles;
