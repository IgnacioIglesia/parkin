server {
    listen 80;

    # DNS interno de Docker: el gateway se resuelve en cada request, así nginx arranca aunque
    # el gateway todavía no esté levantado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:80;

    root /usr/share/nginx/html;

    # Los archivos del build llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/(api|graphql)(/|$) {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Rutas del SPA (/buscar, /reservas/...): todas sirven index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
