# Entorno local completo. Las credenciales son solo para desarrollo.
#
#   docker compose up --build                      servicios listos + infraestructura
#   docker compose --profile pendiente up --build  incluye también los servicios sin código aún
#
# Un servicio con `profiles: ["pendiente"]` no tiene código todavía. Cuando su responsable
# lo mergea a main, borra esa línea y pasa a levantar con el resto.
services:
  gateway:
    build: ./gateway
    ports: ["8080:80"]
    restart: unless-stopped

  usuarios:
    build: ./usuarios
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://app:app@db-usuarios:5432/usuarios
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
    volumes: ["./infra/jwt:/run/secrets:ro"]  # generar con infra/jwt/generar-claves.sh
    ports: ["3001:3000"]
    depends_on:
      db-usuarios: { condition: service_healthy }
    restart: unless-stopped

  cocheras:
    build: ./cocheras
    environment:
      DATABASE_URL: postgres://app:app@db-cocheras:5432/cocheras
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports: ["4000:4000"]
    depends_on:
      db-cocheras: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  reservas:
    build: ./reservas
    environment:
      DATABASE_URL: postgres://app:app@db-reservas:5432/reservas
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RETENCION_MINUTOS: "10"
      COCHERAS_URL: http://cocheras:4000
    ports: ["8000:8000"]
    depends_on:
      db-reservas: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  pagos:
    profiles: ["pendiente"]
    build: ./pagos
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://app:app@db-pagos:5432/pagos
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      PASARELA_ACCESS_TOKEN: ${PASARELA_ACCESS_TOKEN:-}
    ports: ["3002:3000"]
    depends_on:
      db-pagos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  db-usuarios:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: usuarios }
    ports: ["5441:5432"]
    volumes: ["pg-usuarios:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-cocheras:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: cocheras }
    ports: ["5442:5432"]
    volumes: ["pg-cocheras:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cocheras"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-reservas:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: reservas }
    ports: ["5443:5432"]
    volumes: ["pg-reservas:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-pagos:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: pagos }
    ports: ["5444:5432"]
    volumes: ["pg-pagos:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pagos"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    # Exchange, colas y bindings se crean al arrancar (ver docs/contratos.md, sección 7).
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.1.0
    ports: ["3100:3100"]

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports: ["16686:16686", "4318:4318"]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, jaeger]

volumes:
  pg-usuarios:
  pg-cocheras:
  pg-reservas:
  pg-pagos:
