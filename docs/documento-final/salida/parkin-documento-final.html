<script type="application/json" id="secciones">["# Introducción\n\n## La idea\n\nparkIN es una plataforma distribuida de alquiler de cocheras por franja horaria. Los propietarios publican las cocheras que no usan, y los conductores las buscan en un mapa, las reservan por horas y las pagan, con confirmación en tiempo real para las dos partes.\n\n## El problema\n\nEncontrar estacionamiento en zonas de alta densidad urbana genera congestión y pérdida de tiempo. A la vez, existen muchas cocheras en edificios y casas que quedan vacías durante varias horas del día. No hay un mecanismo seguro y eficiente que conecte ambas puntas y, sobre todo, que gestione **reservas concurrentes**: si dos conductores intentan reservar la misma cochera a la misma hora, el sistema no puede dejar que ambos lo consigan (una doble reserva) ni mostrar como libre una cochera que ya está tomada (una «cochera fantasma»).\n\nEse es el corazón técnico del proyecto, y lo que lo vuelve un problema de **sistemas distribuidos**: varias personas, desde distintos dispositivos y contra distintas instancias del sistema, deben ver un estado consistente sin sacrificar disponibilidad ni tiempos de respuesta.\n\n## La solución propuesta\n\nUn sistema de microservicios orientado a eventos, con cuatro servicios de negocio, cada uno con su propia base de datos:\n\n- **Usuarios:** registro, inicio de sesión y roles (propietario y conductor). Emite los tokens de autenticación.\n- **Cocheras:** alta y gestión de cocheras, disponibilidad semanal y búsqueda geográfica.\n- **Reservas:** reserva por franja horaria, con la garantía de que nunca haya dos reservas activas solapadas.\n- **Pagos y notificaciones:** cobro mediante una pasarela, reembolsos y avisos en tiempo real.\n\nDelante de ellos hay un **API Gateway** que es el único punto de entrada y valida la identidad de cada pedido, y un broker de mensajes (RabbitMQ) que coordina el flujo de reserva y pago sin que los servicios dependan unos de otros en el momento. Una web (React) es el único cliente.\n\n## Alcance\n\nEstá implementado de punta a punta:\n\n- registro e inicio de sesión de propietarios y conductores;\n- publicación de cocheras con su disponibilidad y búsqueda por zona, tipo de vehículo y franja;\n- reserva con control de concurrencia, retención de 10 minutos mientras se paga, cancelación y expiración;\n- pago con una pasarela simulada, aprobación o rechazo, reembolso automático cuando corresponde y avisos en tiempo real;\n- observabilidad con logs, métricas y trazas distribuidas.\n\nQuedan fuera de esta entrega, y se declaran como límites en cada sección: la calificación de cocheras, otros medios de pago y pasarelas reales, los bloqueos de fechas puntuales, la subida de fotos, una política de cancelación con plazos, y el despliegue en la nube con varias réplicas.\n\n## Relevancia\n\nEl problema es real y cotidiano: pérdida de tiempo y tránsito de personas dando vueltas buscando lugar, y un recurso (espacio construido) que se desaprovecha buena parte del día. En Montevideo y en zonas de demanda estacional como Punta del Este en verano, aprovechar mejor ese espacio tiene valor para quien lo necesita y para quien lo ofrece.\n\nDesde lo académico, es un caso donde las características de los sistemas distribuidos se vuelven concretas y se pueden demostrar: concurrencia (que una sola reserva gane), tolerancia a fallos (que nada se pierda si un servicio cae), seguridad y confidencialidad (la dirección exacta solo la ve quien reservó), transparencia (el usuario solo ve \"buscar, reservar y pagar\") y escalabilidad. La sección de diseño explica cómo se aborda cada una.\n\n## Uso de inteligencia artificial\n\nUsamos Claude Code durante todo el proyecto para implementar servicios, escribir pruebas, reproducir y diagnosticar errores, revisar la seguridad del gateway y mantener la documentación al día. Nuestro criterio fue que **la IA escribe y la persona revisa, decide y publica**: la arquitectura, el reparto de servicios y las decisiones entre alternativas fueron del equipo, y cada cambio se verificó corriendo (pruebas contra bases de datos y un broker reales, y recorridos de punta a punta). Algunas decisiones concretas en las que nos apoyamos en ella, siempre con la elección final del equipo: validar el token en el gateway con njs y la clave pública en lugar de consultar a Usuarios en cada pedido; garantizar que no haya dobles reservas con una restricción de la base de datos y no con código de la aplicación; resolver los *deadlocks* que aparecieron con reservas simultáneas con un bloqueo por cochera; publicar los eventos con un *outbox* transaccional para no perderlos si cae RabbitMQ; reembolsar automáticamente los pagos que llegan tarde; y descartar un servicio de Pagos duplicado, aprovechando lo aprendido para detectar que la traza se cortaba en el webhook. La metodología completa y un resumen de las decisiones, con lo que se aceptó y lo que se corrigió, están en el anexo de uso de IA; el registro detallado está en `docs/uso-ia.md`.\n\n## Equipo\n\nMartina Berrutti, Ignacio Iglesia, Romina Lubniski y Diego Marin. Asignatura: Sistemas Distribuidos, Universidad de Montevideo. Docentes: Daniel Canoniero y Josefina Gallinal.\n","# Diseño\n\n## 1. Por qué parkIN es un sistema distribuido\n\nVan Steen y Tanenbaum definen un sistema distribuido como una colección de elementos de cómputo autónomos que se presenta a sus usuarios como un único sistema coherente. parkIN cumple las dos partes:\n\n- **Nodos autónomos:** cuatro servicios de negocio (Usuarios, Cocheras, Reservas y Pagos), cada uno con su propio proceso, su propia base de datos y su propio ciclo de vida. Pueden caerse, reiniciarse o escalar por separado.\n- **Un sistema coherente:** quien usa la web ve una sola aplicación («buscar, reservar, pagar») detrás de una sola dirección, el API Gateway, sin saber cuántos servicios hay ni dónde corren.\n\n## 2. Características de los sistemas distribuidos\n\nLas características se definieron en la preentrega a partir del problema. Esta sección explica cómo se aborda cada una y las nombra como en el curso.\n\n### Concurrencia\n\nEs el corazón del problema: varios conductores pueden intentar reservar la misma cochera en la misma franja en el mismo instante, desde distintos dispositivos y contra distintas réplicas del servicio.\n\n- **Consistencia fuerte donde importa.** La base de Reservas tiene una **restricción de exclusión** (`EXCLUDE USING gist` sobre la cochera y el rango horario) que impide que existan dos reservas activas solapadas. Las altas sobre una misma cochera se **serializan** con un lock de PostgreSQL: el resultado es el mismo que si se hubieran ejecutado una después de la otra (*serializability*). La segunda recibe `409`.\n- **Probado:** 300 rondas de 10 reservas simultáneas y 60 de 40, siempre con una sola aceptada y ningún error del servidor.\n- **Consistencia eventual donde alcanza.** La búsqueda usa una caché de 30 segundos y puede mostrar como libre una franja recién tomada. No produce datos incorrectos, porque el intento de reservarla recibe `409`.\n- **Idempotencia:** cada reserva y cada pago llevan una `Idempotency-Key`, así un doble clic o un reintento no crean dos reservas ni cobran dos veces.\n\n### Seguridad\n\nLa seguridad se aborda en sus cuatro aspectos:\n\n- **Autenticación.** Usuarios emite un JWT firmado con RS256 y un refresh token de un solo uso; si se reutiliza uno pasados 30 segundos de gracia (que evitan cerrar la sesión por una recarga en mal momento), se cierran todas las sesiones de esa persona (posible robo).\n- **Autorización.** El gateway verifica el JWT y pasa la identidad y los roles a los servicios, descartando lo que mande el cliente. Cada servicio controla los permisos: solo el dueño edita su cochera, solo el conductor ve su pago.\n- **Confidencialidad.** La dirección de una cochera suele ser la casa del propietario. Todos ven una ubicación aproximada, fija, a 100-300 m de la real; la exacta solo la ven el dueño y el conductor con reserva confirmada, hasta que termina su franja. Las contraseñas se guardan con bcrypt, y los logs nunca incluyen contraseñas, tokens ni datos de tarjeta.\n- **Integridad.** El precio y el propietario se toman de Cocheras, nunca de lo que mande el cliente. Cada cambio de estado de una reserva se aplica solo si la reserva sigue en el estado esperado (y la cancelación, además, solo si nadie la modificó desde que se leyó, por su número de versión). El webhook de la pasarela solo se acepta con una firma HMAC válida.\n- **Fallos de seguridad.** Rate limiting en el gateway y validación de entrada en cada servicio. Las alertas detectan fuerza bruta (más de 30 logins fallidos en 5 minutos) y refresh tokens reutilizados.\n\n### Confiabilidad y tolerancia a fallos\n\nVan Steen descompone la confiabilidad (*dependability*) en disponibilidad, fiabilidad, *safety* y mantenibilidad. Coulouris enumera las técnicas para tolerar fallos. parkIN usa estas:\n\n| Técnica | Cómo se aplica |\n|---|---|\n| Detección | `/health` y `/ready` en cada servicio, healthchecks de Docker y alertas de Prometheus (servicio caído, errores, mensajes en la cola de fallidos) |\n| Enmascaramiento | Reintentos de las transacciones abortadas por *deadlock*; reentrega de mensajes no confirmados; reconexión automática a RabbitMQ |\n| Tolerancia | Degradación controlada: sin Redis la búsqueda va a la base; sin Reservas, busca sin el filtro de ocupación; sin Pagos, se sigue reservando y los eventos esperan en la cola |\n| Recuperación | Compensaciones de la saga: si el pago se rechaza o vence, la reserva se cancela y la franja se libera; si se cobra algo que ya no corresponde, se reembolsa |\n| Redundancia | Los eventos se guardan en la base antes de publicarse (*outbox*) y las colas son durables: un evento existe en dos lugares hasta que se confirma |\n\nCon estas técnicas se cubren los tres tipos de falla del curso:\n- **Transitorias:** un deadlock o una red lenta se resuelven con un reintento.\n- **Intermitentes:** un broker que se cae y vuelve se cubre con reconexión y outbox.\n- **Permanentes:** un mensaje que nunca se va a poder procesar va a la cola de mensajes fallidos (*Dead Letter Queue*) en lugar de reintentarse para siempre.\n\nLa **mantenibilidad** viene de servicios chicos con una sola responsabilidad, contratos escritos y reinicio automático (`restart: unless-stopped`).\n\n### Disponibilidad\n\nEl sistema debe funcionar a toda hora, y sobre todo en las horas pico. Además de la tolerancia a fallos, la mensajería *at-least-once* con ACK manual hace que un servicio caído no pierda trabajo: lo procesa al volver. Si Pagos cae, se pueden seguir creando reservas (lo probamos apagando Pagos, reservando y volviéndolo a encender).\n\n### Transparencia\n\nLos siete tipos de transparencia de Van Steen, y en qué medida se logran:\n\n| Tipo | En parkIN |\n|---|---|\n| Acceso | La web usa la misma forma de acceso (HTTP con JSON, o GraphQL) sin importar que detrás haya Node o Python, ni qué base usa cada servicio |\n| Ubicación | El cliente conoce una sola URL, la del gateway. Los servicios se ubican entre sí por nombre, no por dirección |\n| Reubicación | El gateway vuelve a resolver el nombre de cada servicio cada 10 segundos: si un contenedor se recrea con otra dirección, se lo sigue encontrando |\n| Migración | Igual que la reubicación: un servicio sin estado puede levantarse en otro lugar sin que el cliente lo note |\n| Replicación | La caché de búsquedas es una copia de los resultados que el usuario no distingue del original. Además, el diseño permite varias réplicas de un servicio que comparten cola y caché, aunque solo lo probamos con una |\n| Concurrencia | Cada conductor reserva como si estuviera solo; si otro le ganó la franja, solo ve «esa franja acaba de ser reservada» |\n| Fallo | El outbox, las colas durables y las compensaciones ocultan la caída de un servicio. Si Pagos cae, el usuario reserva igual |\n\n**Grado de transparencia.** Van Steen advierte que no todo se puede ni conviene ocultar, y en parkIN hay tres cosas que quedan a la vista a propósito:\n- **La latencia del pago:** la confirmación llega unos segundos después, por WebSocket, y la reserva se muestra como «retenida» durante hasta 10 minutos.\n- **La consistencia eventual de la búsqueda:** hasta 30 segundos.\n- **Una falla que no se puede enmascarar:** si Cocheras no responde, no se pueden crear reservas (`503`), porque hace falta el precio.\n\nOcultarlas tendría un costo mayor que mostrarlas.\n\n### Heterogeneidad\n\nReservas está en Python y el resto de los servicios en Node.js. Todas las bases usan PostgreSQL, pero cada una es independiente. Se integran porque se hablan por protocolos estándar (HTTP, GraphQL, AMQP, WebSocket) y con contratos escritos antes de implementar. El **middleware** que enmascara esa heterogeneidad es el gateway (para el cliente) y RabbitMQ (entre servicios). La web es *responsive* y funciona igual en computadora y en celular.\n\n### Apertura\n\nVan Steen pide interfaces completas y neutras: que describan todo lo necesario para usar un componente sin depender de cómo está hecho.\n\n- **Las interfaces de parkIN cumplen eso:** un documento de contratos define cada endpoint, cada evento y el esquema GraphQL antes de implementar, y cualquier cliente que hable HTTP puede usar la misma API que la web.\n- **Interoperabilidad:** Python y Node conviven sin adaptadores.\n- **Portabilidad:** todo corre en contenedores.\n- **Políticas separadas de mecanismos:** por ejemplo, el tiempo de la caché, el plazo de retención y los límites de las alertas son configuración, no código.\n\n### Extensibilidad\n\nCon un exchange de tipo *topic*, un servicio nuevo se suscribe a los eventos que le interesan sin cambiar a quien los publica (por ejemplo, un servicio de calificaciones que escuche `reserva.confirmada`; Reservas ya marca las reservas finalizadas y dejó previsto publicar `reserva.finalizada` cuando haya un consumidor). El tipo de vehículo es un enum que se amplía en el contrato (motos, bicicletas). Un medio de pago nuevo se agrega dentro de Pagos sin tocar Reservas, que solo escucha `pago.aprobado` y `pago.rechazado`.\n\n### Escalabilidad\n\nparkIN apunta a **escalabilidad en tamaño**: más cocheras, más usuarios y picos de demanda (Punta del Este en verano). Usa las tres técnicas del curso:\n\n- **Ocultar latencias:** comunicación asincrónica entre Reservas y Pagos; el conductor no espera a la pasarela para tener su franja retenida.\n- **Particionar y distribuir:** cada servicio con su base (*database per service*), que escala por separado.\n- **Replicar:** caché de búsquedas en Redis e índice geográfico. Los servicios no guardan estado en memoria, así que escalan agregando réplicas.\n\nLa replicación trae inconsistencia, y lo aceptamos solo en la búsqueda (30 segundos de caché), nunca en la reserva ni en el pago. Las métricas de escalabilidad del curso (*throughput* y tiempo de respuesta) se miden en Grafana: requests por segundo y latencia p95 por servicio.\n\n**Límite:** el diseño permite varias réplicas, pero solo se probó con una de cada servicio.\n\n### Calidad de servicio\n\nLa latencia p95 es el indicador de calidad de servicio: hay alertas si la búsqueda o el login superan 500 ms, o si crear una reserva supera 800 ms, durante 5 minutos.\n\n## 3. Arquitectura\n\n### Estilos\n\nparkIN combina tres estilos de los vistos en el curso:\n\n- **Microservicios** (la evolución de la arquitectura orientada a servicios): cada servicio es un proceso separado, con una responsabilidad del dominio y su propia base. No comparten base de datos: las referencias entre servicios son solo identificadores.\n- **Publicación-suscripción orientada a eventos** para el flujo de reserva y pago. Los servicios están **desacoplados por referencia** (quien publica no sabe quién escucha) y, gracias a las colas durables, también **en el tiempo**: un evento espera a que su consumidor vuelva.\n- **Cliente-servidor** entre la web y el gateway, y entre servicios cuando la respuesta hace falta en el momento (Reservas le pide el precio a Cocheras).\n\nDentro de cada servicio hay **capas**: rutas o resolvers, lógica de negocio y acceso a datos.\n\n### Organización lógica\n\nEl diagrama general muestra los componentes y cómo se relacionan, sin tecnologías:\n\n```mermaid\nflowchart LR\n    CL[Cliente web] --> GW[Punto de entrada único<br/>identidad y permisos]\n    GW --> U[Usuarios<br/>cuentas y sesiones]\n    GW --> C[Cocheras<br/>catálogo y búsqueda]\n    GW --> R[Reservas<br/>franjas sin solapamiento]\n    GW --> P[Pagos y notificaciones]\n    R -- precio y dueño --> C\n    C -- ocupación --> R\n    R <-- eventos --> B((Bus de eventos))\n    P <-- eventos --> B\n    B -- reserva confirmada o cancelada --> C\n    P <--> PE[Pasarela de pago externa]\n    P -. avisos en tiempo real .-> CL\n```\n\n| Componente | Por qué existe |\n|---|---|\n| Punto de entrada único | Concentra la autenticación, el rate limiting y la trazabilidad, y oculta la ubicación de los servicios |\n| Usuarios | Único que conoce contraseñas y firma tokens. Aislarlo reduce la superficie de ataque |\n| Cocheras | El catálogo se lee mucho más de lo que se escribe; la búsqueda geográfica y su caché escalan aparte |\n| Reservas | Es el único dueño de la regla «nunca dos reservas solapadas», y la hace cumplir en un solo lugar |\n| Pagos y notificaciones | Aísla la integración con la pasarela externa y las conexiones en tiempo real con los clientes |\n| Bus de eventos | Coordina reserva y pago sin que un servicio tenga que estar disponible cuando el otro lo necesita |\n\n### Organización física\n\nEn la entrega, todo corre en una sola máquina con Docker Compose: un contenedor por servicio, una base PostgreSQL por servicio (la de Cocheras con PostGIS), RabbitMQ, Redis y la pila de observabilidad. Solo el gateway (y la web) deberían quedar publicados hacia afuera.\n\n```mermaid\nflowchart LR\n    W[Web React<br/>NGINX :8081] --> GW[Gateway NGINX + njs<br/>:8080]\n    GW -->|REST| U[Usuarios<br/>Node + Express]\n    GW -->|GraphQL| C[Cocheras<br/>Node + Apollo]\n    GW -->|REST| R[Reservas<br/>Python + FastAPI]\n    GW -->|REST + WebSocket| P[Pagos<br/>Node + Socket.IO]\n    R -->|GraphQL: precio y dueño| C\n    C -->|REST: ocupación| R\n    R <-->|AMQP| MQ[(RabbitMQ)]\n    P <-->|AMQP| MQ\n    MQ -->|AMQP| C\n    P <-->|REST + webhook firmado| PM[Pasarela simulada]\n    C --- RD[(Redis)]\n    P --- RD\n    U --- DBU[(PostgreSQL)]\n    C --- DBC[(PostgreSQL + PostGIS)]\n    R --- DBR[(PostgreSQL)]\n    P --- DBP[(PostgreSQL)]\n```\n\n**Límite:** el compose de desarrollo también publica los puertos de algunos servicios, de las cuatro bases, de RabbitMQ y de Redis, para probarlos sin pasar por el gateway. En un despliegue real se cerrarían.\n\n### Flujo principal: reservar y pagar\n\n1. El conductor reserva; Reservas le pide a Cocheras el precio y el dueño, y crea la reserva en `PENDIENTE_PAGO`. La restricción de exclusión garantiza que gane uno solo.\n2. Reservas publica `reserva.creada`; Pagos la recibe.\n3. El conductor paga en la pasarela, y la pasarela avisa a Pagos con un webhook firmado.\n4. Pagos publica `pago.aprobado`; Reservas confirma y publica `reserva.confirmada`. Cocheras habilita la dirección exacta para ese conductor, y Pagos avisa por WebSocket al conductor y al propietario.\n5. Si el pago se rechaza o pasan 10 minutos, la reserva se cancela o expira y la franja se libera.\n\nLa sección de Comunicación muestra este flujo como diagrama de secuencia, con los mensajes entre servicios.\n\n### Cambios desde las entregas anteriores\n\n| Antes (preentrega o segunda entrega) | Implementado | Por qué |\n|---|---|---|\n| La búsqueda y el *matching* estaban en Reservas | La búsqueda pasó a Cocheras, que consulta la ocupación a Reservas | La búsqueda es sobre el catálogo (ubicación, tipo, disponibilidad semanal) y necesita su índice geográfico y su caché; Reservas se quedó solo con la regla de no solapamiento |\n| El gateway le preguntaba a Usuarios si cada token era válido (primera versión del gateway) | El gateway verifica el JWT localmente con la clave pública | Evita una llamada a Usuarios en cada request y que Usuarios sea un punto único de falla |\n| Clientes iOS, Android y web | Una web *responsive* | Con el tiempo de la entrega, una sola web que funciona en el celular cubre los dos roles |\n\n### Ventajas y desventajas de la arquitectura elegida\n\n**Ventajas**\n- Cada servicio escala, falla y evoluciona por separado. La caída de Pagos no impide reservar.\n- La regla crítica (no solapar) vive en un solo lugar y se cumple aunque haya varias réplicas.\n- Sumar funcionalidades por eventos no obliga a tocar lo que existe.\n\n**Desventajas**\n- **Más piezas que operar:** 4 bases, un broker, una caché y la observabilidad. Sin trazas distribuidas, diagnosticar un error sería mucho más difícil.\n- **No hay transacciones entre servicios:** reservar y pagar se coordina con una saga, que es más compleja que una transacción local y obliga a pensar cada compensación.\n- **Dependencias síncronas:** quedan dos (Reservas a Cocheras y Cocheras a Reservas), y sin Cocheras no se puede reservar.\n\n## 4. Coordinación\n\n### Exclusión mutua\n\nQue dos conductores no tomen la misma franja es un problema de **exclusión mutua distribuida**: la franja es el recurso y reservarla es la sección crítica. Lo resolvemos con el esquema de **servidor central** del curso, donde la base de datos de Reservas hace de coordinador. Todas las réplicas le piden permiso al mismo lugar:\n- un lock por cochera que hace fila con las altas de esa cochera;\n- la restricción de exclusión, que rechaza cualquier solapamiento.\n\nLas dos propiedades que pide el curso se cumplen:\n- **Seguridad:** nunca hay dos reservas en la sección crítica, es decir, nunca dos reservas solapadas.\n- **Pervivencia:** el lock se libera solo al terminar la transacción, aunque el proceso muera, y una transacción abortada se intenta hasta 3 veces en total antes de responder `503`, así que nadie espera para siempre.\n\nEl punto único de falla del servidor central es aceptable acá, porque si la base de Reservas no está, no hay reservas que proteger.\n\n### Tiempo y relojes\n\nEl sistema evita depender del orden temporal entre nodos:\n\n- **Todo en UTC:** todas las horas se guardan en UTC. La tarea que expira las reservas compara su plazo con la hora de la base de Reservas (`now()`), así que varias réplicas de esa tarea no discrepan entre sí.\n- **Los relojes de las máquinas:** el plazo de 10 minutos lo calcula Reservas con su reloj, y Pagos usa el suyo para rechazar el pago de una reserva vencida. En el compose todos los contenedores comparten el reloj del host, así que coinciden. Con varias máquinas haría falta sincronizarlas con NTP, y una diferencia de unos segundos igual queda cubierta: si se llega a cobrar una reserva que ya venció, Pagos la reembolsa.\n- **El orden de los eventos no se deduce de su hora.** Los eventos llevan su momento (`ocurridoEn`), pero ningún consumidor lo usa para ordenarlos, porque con relojes distintos esa hora no es confiable. En su lugar:\n  - cada evento repetido se descarta por su `eventId`;\n  - cada cambio de estado es condicional al estado actual;\n  - un evento fuera de orden no puede deshacer uno posterior. Por ejemplo, si la cancelación le llega a Cocheras antes que la confirmación, el acceso queda revocado.\n\nEl efecto es el mismo que buscan los relojes lógicos de Lamport (respetar la relación «sucede antes»), pero lo garantiza el estado guardado y no una marca de tiempo.\n\n### Saga en lugar de transacción distribuida\n\nReservar y pagar ocurre en dos servicios con bases distintas, así que no hay una transacción que abarque a los dos. En lugar de un protocolo de acuerdo entre servicios (como un *commit* en dos fases), usamos una **saga coreografiada**: cada paso es una transacción local que publica un evento, y si un paso falla se ejecuta una compensación. El sistema queda consistente al final (consistencia eventual), sin bloquear recursos de un servicio mientras espera a otro, y sin que una caída deje a los demás trabados.\n\n**Por qué no un coordinador externo (como ZooKeeper).** El único recurso que necesita exclusión mutua es la franja, y su dueño natural, la base de Reservas, ya ofrece los locks y las restricciones necesarias. Un coordinador aparte sumaría otra pieza que operar sin resolver nada que la base no resuelva.\n\n## 5. Metodología 12-Factor\n\n| Factor | Cómo se aplica |\n|---|---|\n| I. Código base | Un repositorio con una carpeta y una imagen por servicio; el mismo código se despliega en cualquier entorno |\n| II. Dependencias | Declaradas y con versión fija (`package-lock.json` y `requirements.txt`); las imágenes no usan nada de la máquina |\n| III. Configuración | Solo variables de entorno, declaradas en el compose. En el repositorio solo hay credenciales de desarrollo (por ejemplo, `app/app` en las bases); las claves de los JWT se generan al arrancar y no se versionan |\n| IV. Servicios de respaldo | PostgreSQL, RabbitMQ, Redis y Jaeger se ubican por URL; cambiarlos es cambiar una variable. Cocheras funciona sin Redis |\n| V. Construir, distribuir, ejecutar | Un `Dockerfile` por servicio (build), la imagen más la configuración del compose (release) y el contenedor (run) |\n| VI. Procesos | Sin estado en memoria entre requests: todo va a PostgreSQL, Redis o RabbitMQ |\n| VII. Asignación de puertos | Cada servicio expone su propio puerto HTTP; el gateway los publica hacia afuera |\n| VIII. Concurrencia | Se escala agregando réplicas; los consumidores compiten por la misma cola y las migraciones toman un lock para no correr dos veces |\n| IX. Desechabilidad | Arranque en segundos y apagado ordenado con `SIGTERM`; con ACK manual, un mensaje a medio procesar se reentrega |\n| X. Paridad desarrollo/producción | `docker compose up` levanta los mismos servicios de respaldo y versiones que se usarían en producción, sin sustitutos como SQLite |\n| XI. Logs | JSON a la salida estándar; el entorno los recolecta y los manda a Loki |\n| XII. Procesos de administración | **Parcial.** Las migraciones son SQL versionado y corren con el mismo código y configuración, pero al arrancar el servicio y no como un proceso aparte |","# Tecnologías\n\nElegimos cada tecnología por lo que resuelve en su servicio, no por uniformidad. Los servicios solo se hablan por protocolos estándar (HTTP con JSON, GraphQL, AMQP y WebSocket), así que cada uno puede usar el lenguaje y la base que mejor le sirvan sin afectar a los demás. Esa es también la forma en que el proyecto muestra la **heterogeneidad**: Reservas está en Python y el resto en Node.js, y se integran sin problemas porque los contratos (endpoints, eventos y esquema GraphQL) se escribieron antes de implementar.\n\n## Servicios\n\n| Componente | Tecnología | Por qué |\n|---|---|---|\n| Web | React 19, Vite, Tailwind, Leaflet, Socket.IO (cliente) | React y Vite dan un cliente liviano que se sirve como archivos estáticos (desde un contenedor NGINX o desde Vercel). Leaflet dibuja el mapa de búsqueda con OpenStreetMap, sin claves de API ni costo. Socket.IO recibe los avisos en tiempo real |\n| API Gateway | NGINX 1.27 con njs | NGINX es un proxy inverso probado, rápido y con rate limiting incorporado. El módulo njs (JavaScript dentro de NGINX) permite validar el JWT en el propio gateway, porque la versión de código abierto no lo trae |\n| Usuarios | Node.js 24, Express, `bcryptjs`, `jsonwebtoken`, zod | Express es suficiente para una API REST chica. bcrypt (en su versión en JavaScript) guarda las contraseñas con un hash lento a propósito, y los tokens se firman con RS256 para que los demás puedan verificarlos solo con la clave pública |\n| Cocheras | Node.js 24, Apollo Server (GraphQL), DataLoader | GraphQL porque cada pantalla necesita datos distintos de la misma cochera (el mapa, pocos campos de muchas; la ficha, muchos de una). DataLoader agrupa las consultas que se repiten dentro de un mismo pedido para evitar el problema N+1 |\n| Reservas | Python 3.12, FastAPI, psycopg 3, pika | FastAPI valida la entrada con tipos (pydantic) y genera la documentación de la API. psycopg da control fino de las transacciones, que es lo que importa en el servicio que garantiza que no haya dobles reservas. Además, un lenguaje distinto muestra la heterogeneidad |\n| Pagos y notificaciones | Node.js 20, Express, Socket.IO con adaptador de Redis | Socket.IO mantiene la conexión con la web y reconecta solo. El adaptador de Redis está pensado para que un aviso llegue al cliente aunque esté conectado a otra réplica (no lo probamos con más de una) |\n| Pasarela simulada | Node.js 20, sin dependencias | Imita el flujo de Mercado Pago (orden, página de pago, webhook firmado) para poder demostrar el pago completo sin mover dinero real |\n\n## Persistencia\n\nLa letra pide un sistema de ficheros o una base de datos. Usamos **bases de datos**, una por servicio (*database per service*): ningún servicio lee la base de otro, y las referencias entre servicios son solo IDs. Así cada servicio puede cambiar su esquema o caerse sin arrastrar a los demás.\n\n| Servicio | Base | Por qué |\n|---|---|---|\n| Usuarios | PostgreSQL 16 | Datos relacionales simples (usuarios, roles, refresh tokens guardados como hash) con restricciones de unicidad, por ejemplo un solo usuario por email |\n| Cocheras | PostgreSQL 16 con PostGIS 3.4 | La búsqueda es geográfica: «cocheras a menos de N metros de este punto, ordenadas por distancia». PostGIS lo resuelve con `ST_DWithin` y un índice GIST, sin calcular distancias a mano sobre toda la tabla |\n| Reservas | PostgreSQL 16 | Tiene una **restricción de exclusión** (`EXCLUDE USING gist` sobre la cochera y el rango horario) que impide en la propia base que existan dos reservas activas solapadas, aunque lleguen en el mismo instante. También aporta *advisory locks*, `SKIP LOCKED` para las tareas periódicas, y transacciones para el *outbox* |\n| Pagos | PostgreSQL 16 | Necesita transacciones y bloqueos de fila para que el webhook sea idempotente, y un índice único parcial para que haya un solo pago vivo por reserva |\n\n**Por qué PostgreSQL y no una base NoSQL.** El problema central del proyecto es la concurrencia sobre datos que no pueden quedar inconsistentes (una franja, un pago). PostgreSQL ofrece transacciones ACID, restricciones que se cumplen aunque haya varias réplicas del servicio, y bloqueos explícitos. Usar el mismo motor en los cuatro servicios simplifica la operación (una sola imagen, las mismas herramientas), sin que compartan datos.\n\n**Redis 7** se usa para dos cosas cuyos datos pueden perderse sin romper nada: la caché de búsquedas de Cocheras (30 segundos, invalidada por versión) y el adaptador de Socket.IO de Pagos. Si Redis se cae, la búsqueda va directo a la base. Si Pagos arranca sin Redis, espera 5 segundos y sigue sin el adaptador: con una sola réplica los avisos llegan igual.\n\n**Ficheros.** El sistema no guarda archivos: las fotos de las cocheras se guardan como URLs. Subirlas pediría un almacenamiento de objetos compartido entre réplicas (por ejemplo, uno compatible con S3), y quedó como evolución.\n\n## Mensajería\n\n**RabbitMQ 3.13** coordina el flujo de reserva y pago por eventos (`reserva.creada`, `pago.aprobado`, `reserva.confirmada`, etc.) sobre un exchange de tipo *topic*. Lo elegimos frente a Kafka porque lo que necesitamos es repartir cada evento a las colas que lo escuchan, con confirmación por mensaje, reintentos y una cola de mensajes fallidos (*Dead Letter Queue*), y no un registro histórico de eventos ni un volumen alto. RabbitMQ trae todo eso incorporado y es más simple de operar. Las colas son durables: si un servicio cae, los mensajes lo esperan.\n\n## Contenedores y despliegue\n\nCada componente tiene su `Dockerfile` y todo el sistema se levanta con **Docker Compose** (`docker compose up --build`): servicios, bases, broker, caché y observabilidad. Los contenedores aíslan las dependencias de cada servicio (Node 20 y 24, Python 3.12, NGINX), hacen que el entorno sea igual en las cuatro máquinas del equipo y en la de los docentes, y declaran en un solo archivo cómo se conectan las piezas. Los healthchecks y `restart` del compose reinician lo que se cae. Para varias máquinas y autoescalado, el paso siguiente sería un orquestador como Kubernetes; no lo usamos porque el alcance de la entrega es una sola máquina.\n\n## Observabilidad\n\n**OpenTelemetry** para las trazas (exportadas a **Jaeger**), **Prometheus** para las métricas y las alertas, **Loki** con **Alloy** para juntar los logs JSON de todos los contenedores, y **Grafana** para verlo todo en un tablero y saltar de un log a su traza. Son herramientas de código abierto, estándar en la industria e independientes del lenguaje: la misma configuración sirve para los servicios en Node y en Python. El detalle está en la sección de Observabilidad.\n\n## Herramientas de desarrollo\n\n- **Pruebas:** `node:test` en los servicios Node y pytest en Reservas, con pruebas de integración contra PostgreSQL, RabbitMQ y Redis reales.\n- **Inteligencia artificial:** Claude Code (ver la sección de uso de IA en la Introducción).\n- **Control de versiones:** Git y GitHub, con una rama por tarea y pull requests a `main`.\n","# Comunicación\n\nLa letra pide al menos dos formas de comunicación y que se justifique cada una. parkIN usa **cuatro**: REST, GraphQL, mensajería con RabbitMQ y WebSocket. Además, la pasarela de pagos se comunica con Pagos mediante un **webhook** firmado, que es REST en el sentido inverso. Ninguna se eligió por uniformidad: cada una responde a un caso de uso distinto.\n\n## La regla que seguimos\n\n> **Síncrono cuando quien llama necesita la respuesta ya; asíncrono cuando no.**\n\nPara crear una reserva hace falta saber quién es el propietario y cuál es el precio, y el conductor espera la respuesta: eso es una llamada síncrona. Confirmar un pago, en cambio, no necesita que nadie espere: el conductor no se queda mirando mientras la pasarela cobra y Reservas actualiza su estado. Eso viaja como evento.\n\nEn los términos de Kleppmann, que vimos en el curso, hay tres modos de que los datos fluyan entre procesos. parkIN usa dos y descarta uno a propósito:\n\n| Modo | En parkIN |\n|---|---|\n| A través de la base de datos | **No se usa entre servicios.** Cada servicio tiene su propia base y nadie lee la de otro (*database per service*). Una base compartida acoplaría los esquemas: un cambio en una tabla rompería a otro servicio, y una base caída tiraría abajo a todos |\n| A través de servicios (REST, GraphQL) | Web con los servicios, y Reservas con Cocheras. Síncrono: se espera la respuesta |\n| Paso de mensajes asíncrono | RabbitMQ entre Reservas, Pagos y Cocheras |\n\n## Vista general\n\n```mermaid\nflowchart LR\n    W[Web] -->|REST| GW[Gateway]\n    W -->|GraphQL| GW\n    W <-.->|WebSocket| GW\n    GW -->|REST| U[Usuarios]\n    GW -->|GraphQL| C[Cocheras]\n    GW -->|REST| R[Reservas]\n    GW -->|REST y WebSocket| P[Pagos]\n    R -->|GraphQL: propietario y precio| C\n    C -->|REST: ocupación| R\n    R <-->|eventos| MQ[(RabbitMQ)]\n    P <-->|eventos| MQ\n    MQ -->|eventos| C\n    P <-->|REST: orden y reembolso| PM[Pasarela]\n    PM -->|webhook firmado| P\n```\n\n## Los cuatro mecanismos\n\n| Mecanismo | Entre quiénes | Por qué se eligió | Caso de uso |\n|---|---|---|---|\n| **REST sobre HTTP** | Web con Usuarios, Reservas y Pagos | Operaciones simples sobre recursos, fáciles de monitorear por código de estado y de reintentar con una clave de idempotencia | Registrarse, crear y cancelar una reserva, iniciar un pago |\n| **GraphQL** | Web con Cocheras; Reservas con Cocheras | Cada pantalla necesita datos distintos de la misma cochera: el mapa pide pocos campos de muchas cocheras y la ficha pide muchos de una sola. El cliente pide exactamente lo que necesita en un solo pedido | Buscar cocheras en el mapa, ver la ficha, publicar una cochera |\n| **Mensajería (RabbitMQ, AMQP)** | Reservas, Pagos y Cocheras entre sí | Desacoplamiento en el tiempo: si un servicio cae, los mensajes esperan en la cola y no se pierde el trabajo. Un servicio nuevo se suscribe sin tocar a quien publica | La saga de reserva y pago |\n| **WebSocket (Socket.IO)** | Pagos hacia la web | El servidor empuja el aviso en el momento en que ocurre, sin que el cliente pregunte | «Tu reserva está confirmada» sin recargar la página |\n\n### REST\n\nLa web habla con Usuarios, Reservas y Pagos por HTTP con JSON, siempre a través del gateway: el cliente llama `/api/reservas/...` y el servicio recibe `/reservas/...`. Se usan los verbos y los códigos de estado con su significado:\n\n- `201` cuando se crea una reserva o un pago, `409` cuando la franja ya está ocupada, `401` sin token y `403` con un token válido pero sin permiso, `429` cuando se supera el límite de pedidos y `503` con `Retry-After` cuando una dependencia no está disponible.\n- `POST /reservas` y `POST /pagos` exigen el header **`Idempotency-Key`**. `POST` no es idempotente por definición: si la respuesta se pierde y el cliente reintenta, sin la clave se crearían dos reservas o dos cobros. Con la clave, el segundo intento devuelve lo ya creado.\n- No hay sesión en el servidor: el token de identidad viaja en `Authorization` en cada pedido.\n\n### GraphQL\n\nCocheras expone un único endpoint (`POST /graphql`) con consultas (`buscarCocheras`, `cochera`, `misCocheras`) y mutaciones (`crearCochera`, `actualizarCochera`, `definirDisponibilidad`, `eliminarCochera`). Dos decisiones de diseño lo hacen seguro y rápido: la profundidad máxima de una consulta es 5, para frenar consultas maliciosas, y DataLoader agrupa las consultas repetidas para evitar el problema N+1. Como GraphQL responde `200` aun con errores, cada operación se mide con su resultado y hay una alerta sobre las que fallan.\n\nSe usa solo en Cocheras porque es el único servicio donde el cliente necesita formas de respuesta muy distintas. En Usuarios, Reservas y Pagos las respuestas son pequeñas y fijas, y REST alcanza.\n\n### Mensajería con RabbitMQ\n\nReservas, Pagos y Cocheras se avisan lo que pasa con **eventos** publicados en un *exchange* de tipo *topic* llamado `cocheras.eventos`. Cada servicio tiene su propia cola y se suscribe solo a los eventos que le interesan.\n\n| Evento | Lo publica | Lo consumen | Efecto |\n|---|---|---|---|\n| `reserva.creada` | Reservas | Pagos | Pagos queda listo para cobrar esa reserva |\n| `pago.aprobado` | Pagos | Reservas | La reserva pasa a `CONFIRMADA` |\n| `pago.rechazado` | Pagos | Reservas | La reserva se cancela y se libera la franja |\n| `reserva.confirmada` | Reservas | Pagos, Cocheras | Aviso en tiempo real; Cocheras habilita la dirección exacta y limpia su caché |\n| `reserva.cancelada` | Reservas | Pagos, Cocheras | Reembolso si corresponde, aviso y limpieza de caché |\n| `reserva.expirada` | Reservas | Pagos | Se anula el pago pendiente y se avisa al conductor |\n\nTodos los mensajes tienen la misma forma: un `eventId` único, el `tipo`, la fecha, el `traceId` y los `datos`. Las colas son:\n\n| Cola | La consume | Eventos |\n|---|---|---|\n| `reservas.pago-eventos` | Reservas | `pago.aprobado`, `pago.rechazado` |\n| `pagos.reserva-eventos` | Pagos | `reserva.creada`, `reserva.confirmada`, `reserva.cancelada`, `reserva.expirada` |\n| `cocheras.reserva-eventos` | Cocheras | `reserva.confirmada`, `reserva.cancelada` |\n| `cocheras.dlq` | Nadie: se inspecciona a mano | Lo que superó 3 entregas |\n\n**Garantías.** La mensajería no es confiable por sí sola; se la hace confiable con cuatro piezas que se combinan:\n\n1. **Outbox transaccional.** Reservas y Pagos guardan el evento en su propia base, en la misma transacción que el cambio de estado, y un publicador aparte lo envía después con *publisher confirms*. Así no hay cambio sin evento ni evento sin cambio, y si RabbitMQ está caído el evento espera.\n2. **Colas durables (*quorum*) y ACK manual.** Un mensaje solo sale de la cola cuando el consumidor confirma que lo procesó. Si el consumidor muere a mitad, RabbitMQ lo reentrega.\n3. **Reintentos y Dead Letter Queue.** Un mensaje que falla se reintenta hasta 3 veces y después va a `cocheras.dlq`, donde dispara una alerta. Un mensaje roto, que nunca se podrá procesar, va directo ahí.\n4. **Consumidores idempotentes.** La entrega es *at-least-once*: un mensaje puede llegar repetido. Cada consumidor guarda el `eventId` que ya procesó y descarta los repetidos.\n\nEl resultado es que «nada se pierde y nada se aplica dos veces» es una propiedad del diseño y no una aspiración.\n\n**Por qué RabbitMQ y no Kafka.** Lo que necesitamos es repartir cada evento a las colas que lo escuchan, con confirmación por mensaje, reintentos y una cola de mensajes fallidos. No necesitamos un registro histórico de eventos ni un volumen alto. RabbitMQ trae todo eso incorporado y es más simple de operar.\n\n### WebSocket\n\nEl WebSocket va de Pagos a la web, y se usa para un solo propósito: avisar en el momento que una reserva se confirma, se cancela o vence, o que un pago se rechaza. Se implementa con Socket.IO, que agrega reconexión automática y salas.\n\n- **Autenticación en el *handshake*.** El navegador no puede mandar headers personalizados en un WebSocket, así que el token viaja en la conexión y Pagos lo verifica con la clave pública. Un token falso se rechaza con `TOKEN_INVALIDO`.\n- **Salas por usuario.** Cada conexión entra a la sala `user:{id}`. Cada aviso se emite a la sala del destinatario: nadie recibe avisos de reservas ajenas, y si el usuario tiene varias pestañas abiertas, le llegan a todas.\n- **Varias réplicas.** El adaptador de Redis reparte cada aviso entre réplicas de Pagos: llega aunque el cliente esté conectado a otra instancia. Está implementado y no se probó con más de una réplica. Si Redis no responde al arrancar, Pagos arranca igual sin el adaptador.\n- **Es un aviso, no la fuente de verdad.** Si el usuario estaba desconectado, no se pierde información: la reserva se consulta por REST. La pantalla además consulta el estado cada 5 segundos mientras la reserva espera el pago, como respaldo.\n\nFrente a las alternativas: con *polling* solo, el aviso tarda lo que tarde la próxima consulta y cada pestaña carga al servidor; con *Server-Sent Events* alcanzaría para avisos en un solo sentido, pero Socket.IO trae reconexión y salas por usuario.\n\n### El webhook de la pasarela\n\nCuando el usuario paga, la pasarela avisa a Pagos con una llamada HTTP a `POST /pagos/webhook`. Esa llamada **no lleva token de usuario**, porque no la hace una persona, así que se autentica de otra manera: la pasarela firma el cuerpo con **HMAC-SHA256** y un secreto compartido, y Pagos la verifica antes de hacer nada. Sin firma válida responde `401` y no cambia el pago.\n\nComo las pasarelas reintentan sus avisos, el webhook es **idempotente**: solo el primer aviso de un pago pendiente cambia su estado; los siguientes se responden con `200` para que dejen de reintentar. La pasarela simulada reintenta hasta 4 veces, con espera creciente.\n\n## Cómo viaja una reserva de punta a punta\n\nPara ver los cuatro mecanismos juntos, este es el recorrido de una reserva que se paga:\n\n1. La web crea la reserva por **REST** (`POST /api/reservas`) con una `Idempotency-Key`.\n2. Reservas pregunta a Cocheras el propietario y el precio por **GraphQL**, de forma síncrona.\n3. Reservas guarda la reserva y publica `reserva.creada` por **RabbitMQ**.\n4. La web inicia el pago por **REST** (`POST /api/pagos`). Pagos crea la orden en la pasarela y devuelve la dirección de pago.\n5. El usuario paga en la pasarela, que avisa a Pagos por **webhook**.\n6. Pagos publica `pago.aprobado`; Reservas confirma y publica `reserva.confirmada`, por **RabbitMQ**.\n7. Pagos avisa a conductor y propietario por **WebSocket**, y Cocheras habilita la dirección exacta.\n\nUn mismo identificador de traza (`traceId`) recorre los pasos: nace en el gateway, viaja en los headers HTTP y dentro de cada evento, y permite seguir la reserva completa en Jaeger.\n\n## Qué pasa cuando algo falla\n\n| Falla | Efecto |\n|---|---|\n| Pagos se cae | Reservas sigue aceptando reservas. Los eventos esperan en la cola y se procesan cuando Pagos vuelve |\n| RabbitMQ se cae | Los servicios siguen respondiendo pedidos. Los eventos esperan en el *outbox* y se publican al volver |\n| Reservas se cae | La búsqueda de cocheras sigue funcionando, sin filtrar por ocupación. No se pueden crear reservas |\n| Cocheras se cae | No se pueden crear reservas (`503`): Reservas necesita el precio y el propietario |\n| Se pierde un aviso por WebSocket | La pantalla se actualiza igual con la consulta periódica |\n| La pasarela no responde | Se anula ese intento de pago; la reserva se puede volver a pagar |\n\n## Límites\n\n- **Reservas y Cocheras dependen la una de la otra en forma síncrona.** Es el acoplamiento más fuerte que quedó: sin Cocheras no se crean reservas. Se aceptó porque el conductor espera esa respuesta y el precio no puede venir del cliente.\n- **El contexto de traza viaja solo como `traceId` dentro de los eventos**, no como el `traceparent` completo, y el gateway no aparece como un tramo en las trazas. En Jaeger, algunos tramos muestran un aviso de padre desconocido.\n- **La entrega de eventos es *at-least-once***, no exactamente una vez: la idempotencia de los consumidores es lo que lo compensa.\n- **El WebSocket se probó con una sola réplica de Pagos.**\n","# Producto\n\nLa web es el único cliente de parkIN. Solo habla con el API Gateway, así que quien la usa no sabe cuántos servicios hay detrás: ve «buscar, reservar y pagar». Funciona igual en computadora y en celular, y una misma cuenta puede ser conductor, propietario o las dos cosas.\n\nSu lenguaje visual es un **tablero de partidas**: códigos, precios, horarios y estados se muestran en celdas que giran cuando cambian, y cada estado tiene un color fijo (ámbar para retenida, verde para confirmada, rojo para cancelada o vencida). Así el estado de una reserva se entiende sin leer una explicación.\n\n## 1. Registro y autenticación\n\nAl registrarse se eligen uno o los dos roles. La sesión dura mientras se use la web: el access token se renueva solo cada 15 minutos sin que la persona lo note, y cerrar sesión en una pestaña la cierra en todas.\n\n![Ingreso](../capturas/web-01-ingreso.png)\n![Registro con los dos roles](../capturas/web-02-registro.png)\n\nEn Perfil se editan los datos de contacto, se suma el otro rol y se puede cerrar la sesión en todos los dispositivos (por ejemplo, si se perdió el celular).\n\n![Perfil](../capturas/web-13-perfil.png)\n\n## 2. Alta y gestión de cocheras\n\nEl propietario publica una cochera con su título, precio por hora, el vehículo más grande que entra y su dirección, y marca el lugar exacto tocando el mapa. Después define en qué días y horarios se alquila; sin horarios la cochera no aparece en la búsqueda.\n\n![Publicar una cochera](../capturas/web-10-publicar-cochera.png)\n![Horarios por día](../capturas/web-11-horarios-cochera.png)\n![Tus cocheras](../capturas/web-12-tus-cocheras.png)\n\n## 3. Búsqueda y reserva por franja\n\nEl conductor elige dónde (un barrio o un punto tocado en el mapa), desde y hasta qué hora, y el tipo de vehículo. El mapa y el tablero muestran solo las cocheras libres en toda esa franja. Cada cochera aparece en una **zona aproximada**: la dirección exacta es un dato sensible del propietario y solo se revela con la reserva confirmada.\n\n![Búsqueda en el mapa](../capturas/web-03-mapa-busqueda.png)\n![Ficha de la cochera](../capturas/web-04-ficha-cochera.png)\n\nAl reservar, la franja queda **retenida 10 minutos** mientras se paga, con la cuenta regresiva a la vista.\n\n![Reserva retenida](../capturas/web-05-reserva-retenida.png)\n\nSi otra persona intenta la misma cochera y franja (aunque sea en el mismo instante, desde otro dispositivo), recibe «Esa franja acaba de ser reservada»: la base de datos de Reservas no permite dos reservas activas solapadas.\n\n![Conflicto por franja ocupada](../capturas/web-06-conflicto-franja-ocupada.png)\n\n## 4. Pago y notificación\n\n«Pagá» abre la pasarela de pago en otra pestaña. Es una pasarela simulada, que imita el flujo de Mercado Pago (orden, página de pago y aviso firmado a Pagos) sin mover dinero real: ofrece aprobar o rechazar el pago.\n\n![Pasarela de pago](../capturas/pago-01-pasarela-checkout.png)\n\nAl aprobar, sin recargar nada, la reserva pasa a **Confirmada**, llega el aviso en tiempo real y aparece la dirección exacta.\n\n![Reserva confirmada con el aviso en vivo](../capturas/web-07-reserva-confirmada.png)\n\nSi el pago se rechaza, la pasarela da la orden por cerrada, llega el aviso, la reserva queda cancelada y la franja se libera para otra persona.\n\n![Orden rechazada en la pasarela](../capturas/pago-05-pasarela-resuelta.png)\n\n![Pago rechazado](../capturas/web-08-pago-rechazado.png)\n\nEn «Reservas» cada persona ve las que hizo y, si es propietaria, las que recibieron sus cocheras, con su estado.\n\n![Mis reservas](../capturas/web-09-mis-reservas.png)\n\n## 5. En el celular\n\nLa misma web se adapta al ancho de un teléfono: el mapa arriba y el tablero debajo.\n\n![Búsqueda en el celular](../capturas/web-14-mapa-celular.png)\n","# Observabilidad\n\nLa letra pide al menos uno de los pilares de la observabilidad. Implementamos los tres (**logs, métricas y trazas**) y los unimos con un mismo identificador, el `traceId`, para poder pasar de uno a otro.\n\nDistinguimos observabilidad de monitoreo, como en el curso. La observabilidad es la propiedad de poder entender el estado interno del sistema a partir de lo que emite. El monitoreo es usarla: mirar indicadores, detectar patrones y actuar. Las alertas y el tablero son el monitoreo; los logs, métricas y trazas que los alimentan son la observabilidad.\n\nEn parkIN hace falta más de un pilar porque un solo pedido recorre varios procesos. Reservar y pagar pasa por el gateway, Reservas, Cocheras, RabbitMQ, Pagos y la pasarela, y la confirmación vuelve por eventos. Si algo falla, el log de un solo servicio no alcanza para saber dónde: hay que poder seguir el recorrido entero.\n\n## Cómo se implementó\n\n```mermaid\nflowchart LR\n    S[Servicios] -- logs JSON a stdout --> A[Alloy] --> L[(Loki)]\n    P[(Prometheus)] -- lee /metrics cada 15 s --> S\n    P -- mensajes por cola --> MQ[RabbitMQ]\n    S -- trazas OTLP --> J[(Jaeger)]\n    G[Grafana] --> L & P & J\n```\n\nLos servicios no conocen a Loki ni a Grafana. Cada uno escribe sus logs en la salida estándar, expone un endpoint de métricas y manda sus trazas a la dirección que le indica una variable de entorno. La infraestructura junta todo. Esto sigue el factor XI de 12-Factor (los logs son un flujo de eventos) y permite sumar un servicio sin tocar la configuración de los demás.\n\n| Pilar | Herramienta | Qué registra cada servicio |\n|---|---|---|\n| Logs | Alloy y Loki | Una línea JSON por evento, con `nivel`, `servicio`, `mensaje`, `traceId` y, cuando corresponde, `usuarioId`, `cocheraId` o `reservaId`. Nunca contraseñas, tokens ni datos de tarjeta |\n| Métricas | Prometheus | Requests y latencia por ruta (con el mismo formato de nombre y las mismas etiquetas en todos los servicios, para compararlos en un mismo panel) y métricas de negocio propias |\n| Trazas | OpenTelemetry y Jaeger | Un span por request, por consulta a la base, por llamada a otro servicio y por evento publicado o consumido |\n\nGrafana reúne los tres en un solo tablero, que abre como pantalla de inicio. Desde un log se salta a su traza en Jaeger, y desde una traza a los logs de todos los servicios con ese `traceId`.\n\n## Un mismo `traceId` en todo el recorrido\n\n1. El gateway genera el `traceId` (header W3C `traceparent`), lo escribe en su propio log y lo devuelve al cliente en `X-Trace-Id`.\n2. Cada servicio continúa esa traza, lo escribe en sus logs y lo propaga cuando llama a otro (Reservas a Cocheras, Cocheras a Reservas).\n3. Los eventos de RabbitMQ llevan el `traceId` dentro del mensaje, así que quien los consume sigue en la misma traza. El pago aprobado, la confirmación de la reserva y la dirección habilitada en Cocheras aparecen juntos, aunque ocurrieron en servicios distintos y en momentos distintos.\n\nCon eso, buscar `{servicio=~\".+\"} |= \"<traceId>\"` en Loki devuelve el recorrido completo de un pedido, empezando por la línea del gateway.\n\n![Traza de una reserva en Jaeger: Reservas consulta a Cocheras dentro de la misma traza](../capturas/reservas-01-jaeger-reserva-ganadora.png)\n\n![Traza de la saga del pago en Jaeger](../capturas/pago-06-jaeger-saga-del-pago.png)\n\n![Traza de una búsqueda en Cocheras: consulta a Redis, consulta geográfica en PostGIS y DataLoader agrupando las consultas de disponibilidad; más abajo, las consultas de ocupación a Reservas (2 servicios, 63 spans)](../capturas/cocheras-02-jaeger-busqueda.png)\n\n## Métricas\n\nAdemás de requests y latencia, cada servicio mide lo que importa en su dominio:\n\n| Servicio | Métricas propias |\n|---|---|\n| Cocheras | Operaciones GraphQL por resultado (GraphQL responde 200 aunque haya errores, así que se mide aparte), aciertos y fallos de la caché de Redis, consultas de ocupación a Reservas, eventos procesados y estado de RabbitMQ y Redis |\n| Reservas | Reservas creadas, confirmadas, canceladas y expiradas; conflictos 409; reintentos de transacción; eventos en el outbox sin publicar |\n| Pagos | Pagos creados, aprobados y rechazados; webhooks; reembolsos; outbox; conexiones WebSocket abiertas |\n| Usuarios | Registros, logins correctos y fallidos, renovaciones de sesión por resultado (incluidos los tokens reutilizados) |\n| Gateway | Estado de NGINX y requests totales, por medio de un exportador |\n| RabbitMQ | Mensajes en cada cola, incluida la de mensajes fallidos |\n\nLa latencia p95 por servicio es la medida de **calidad de servicio** del sistema: dice cuánto espera el 95 % de los usuarios, y las alertas avisan cuando se pasa del límite que fijamos para las operaciones críticas.\n\n![Tablero técnico de Grafana con tráfico de la demo](../capturas/infra-01-grafana-tecnico.png)\n\n![Fila de Cocheras: operaciones GraphQL, latencia por operación, 88,9 % de búsquedas resueltas desde la caché de Redis, eventos consumidos y consultas de ocupación a Reservas](../capturas/cocheras-01-grafana-fila-cocheras.png)\n\n![Fila de Usuarios](../capturas/usuarios-01-grafana-fila-usuarios.png)\n\n## Alertas\n\nPrometheus evalúa 18 alertas, definidas en un archivo versionado junto con el código. Se agrupan en cuatro tipos:\n\n- **Algo se cayó:** un servicio deja de exponer métricas (`ServicioCaido`), el gateway no responde (`GatewayCaido`), Cocheras pierde la conexión con RabbitMQ o no llega a Reservas.\n- **Errores y lentitud:** más de 2 % de errores internos en un servicio, o la p95 por encima del límite (500 ms para la búsqueda y el login, 800 ms para crear una reserva).\n- **Mensajes que no avanzan:** eventos en la cola de mensajes fallidos (`EventosEnDLQ`), o eventos que se acumulan en el outbox porque RabbitMQ no los recibe, aunque la API siga respondiendo bien.\n- **Seguridad y negocio:** más de 30 logins fallidos en 5 minutos (posible fuerza bruta), un refresh token reutilizado (posible sesión robada), reembolsos con error o un exceso de reservas que expiran sin pagarse (señal de un problema con Pagos).\n\n![Alertas en Prometheus: `EventosEnDLQ` disparada después de publicar un evento inválido, que terminó en la cola de mensajes fallidos](../capturas/cocheras-03-prometheus-alertas.png)\n\n## Beneficios: qué nos permitió encontrar\n\nLa observabilidad no quedó solo para la demo: encontró dos errores reales durante el desarrollo.\n\n1. **Errores 500 con reservas simultáneas.** En la prueba de punta a punta, con varias reservas a la vez sobre la misma franja, algunas respondían 500 en lugar de 409. Los logs de Reservas mostraron que PostgreSQL abortaba las transacciones por *deadlock* en la restricción de exclusión; al reproducirlo, pasaba en 34 de cada 600 intentos. Nunca hubo doble reserva, pero el usuario recibía un error del servidor en lugar de «franja ocupada». Se corrigió con un lock por cochera: después, 300 rondas de 10 reservas simultáneas y 60 de 40 terminaron siempre con una aceptada y ningún 500, y la demo con 20 conductores da 1 reserva y 19 conflictos. La métrica `reservas_reintentos_transaccion_total` quedó para vigilarlo.\n2. **RabbitMQ no arrancaba desde cero.** Con un volumen nuevo, el broker fallaba al importar su configuración. El log del contenedor mostraba el motivo exacto, y se corrigió declarando el virtual host en la configuración del broker.\n\nAdemás, la prueba de un evento inválido mostró el camino completo de un fallo: el mensaje terminó en la cola de mensajes fallidos y disparó la alerta `EventosEnDLQ`.\n\nEn la operación diaria, cada señal responde una pregunta distinta. Las **métricas** dicen que algo anda mal (sube la latencia, crecen los conflictos o se acumula el outbox). Las **trazas** dicen dónde (qué servicio o qué consulta tarda). Los **logs** dicen por qué (el error exacto).\n\n![A la izquierda, los logs de una reserva en todos los servicios, filtrados por su `traceId`; con «Ver traza en Jaeger» se abre a la derecha la traza completa](../capturas/cocheras-04-loki-log-a-traza.png)\n\nDe los desafíos que plantea el curso, dos se nos presentaron:\n- **El monitoreo de microservicios y contenedores,** que resolvimos haciendo que cada servicio emita lo mismo, con el mismo formato de nombres y etiquetas. Por eso un panel compara la latencia de los cuatro.\n- **El volumen de datos,** que acotamos no registrando los healthchecks ni `/metrics`, a los que Docker y Prometheus llaman cada pocos segundos.\n\n## Límites\n\n- El gateway genera el `traceId` y lo escribe en sus logs, pero no exporta spans: en Jaeger la traza empieza en el primer servicio.\n- Los eventos llevan el `traceId` pero no el span que los publicó, así que Jaeger muestra su procesamiento dentro de la traza correcta, pero con un aviso de «padre desconocido».\n- La pila de observabilidad corre en una sola instancia, con la retención por defecto y Grafana sin login. Alcanza para desarrollo y para la defensa; en producción haría falta autenticación, retención definida y un destino para las alertas (hoy solo se ven en Prometheus).\n","# Conclusión\n\n## Qué logramos\n\nEl objetivo era resolver un problema concreto de sistemas distribuidos: que muchas personas, desde distintos dispositivos y al mismo tiempo, puedan reservar y pagar cocheras sin dobles reservas ni cocheras fantasma. parkIN lo cumple de punta a punta:\n\n- **Cuatro funcionalidades operativas y demostrables:** registro y autenticación; alta y gestión de cocheras; búsqueda y reserva por franja; pago con avisos en tiempo real.\n- **Cuatro formas de comunicación**, cada una elegida por su caso de uso: REST, GraphQL, mensajería con RabbitMQ y WebSocket.\n- **Persistencia** con una base PostgreSQL por servicio, y PostGIS para la búsqueda geográfica.\n- **Los doce factores de 12-Factor**, uno de ellos (los procesos de administración) de forma parcial.\n- **Los tres pilares de la observabilidad**, unidos por un mismo identificador de traza.\n\nLa garantía central se probó y no solo se diseñó. En la prueba con 20 conductores reservando la misma franja en el mismo instante, entra uno solo y los otros 19 reciben «franja ocupada». La garantía se sostiene aunque se caiga un servicio, se repita un mensaje o el pago llegue tarde.\n\n## Lo que aprendimos\n\n**La consistencia se pone donde todos coinciden.** La primera intuición era verificar en el código si la franja estaba libre antes de guardarla, y eso falla con concurrencia: dos pedidos pueden ver la franja libre a la vez. La regla terminó en la base de datos, el único lugar que comparten todas las réplicas. Es el esquema de exclusión mutua con servidor central visto en el curso, con la base como coordinador.\n\n**No todo necesita consistencia fuerte.** Exigirla en todo el sistema lo habría vuelto lento y frágil. La aplicamos al reservar y al pagar, y aceptamos consistencia eventual en la búsqueda (30 segundos de caché). La pantalla puede quedar un poco vieja, pero el sistema nunca acepta una reserva incorrecta.\n\n**Sin transacciones entre servicios, hay que diseñar las fallas.** Reservar y pagar ocurren en servicios con bases distintas. La saga obligó a pensar cada caso antes de que pasara: el pago se rechaza, nadie paga, se paga tarde, se cancela después de pagar. El outbox y la idempotencia fueron lo que permitió que «nada se pierde y nada se aplica dos veces» fuera cierto y no una aspiración.\n\n**Lo que no se observa, no se puede arreglar.** Con cuatro servicios y un broker, un error sin trazas es casi imposible de ubicar. La observabilidad no quedó para la demo: encontró errores reales mientras desarrollábamos.\n\n**Los contratos escritos permiten trabajar en paralelo.** Cuatro personas, dos lenguajes y cuatro servicios se integraron porque los endpoints, los eventos y el esquema GraphQL estaban escritos antes de implementarlos.\n\n## Problemas encontrados y cómo los resolvimos\n\n| Problema | Cómo apareció | Solución |\n|---|---|---|\n| Con reservas simultáneas, algunas respondían `500` en lugar de `409` | La prueba de punta a punta y los logs de Reservas (ver Observabilidad) | Un lock por cochera, y reintento de la transacción abortada. Nunca hubo doble reserva, pero el error era incorrecto |\n| RabbitMQ no arrancaba en una máquina limpia | Al levantar el sistema desde cero con un volumen nuevo | Se declaró el virtual host en la configuración del broker |\n| El sistema no arrancaba en frío: el gateway y Pagos buscaban la clave pública antes de que existiera, y Docker creaba una carpeta en su lugar | Al probar en un clon limpio del repositorio | Un servicio genera las claves la primera vez, y los demás esperan a que termine |\n| La traza del pago se cortaba en el webhook, porque el aviso de la pasarela llega desde afuera y sin contexto | Al seguir una reserva en Jaeger | Pagos guarda el identificador de traza al crear el pago y cuelga de él el aviso y todo lo que sigue |\n| Validar el token consultando a Usuarios sumaba una llamada en cada request y hacía de Usuarios un punto único de falla | Al revisar el diseño de la segunda entrega | El gateway verifica la firma del JWT con la clave pública, sin llamar a Usuarios |\n\n## Límites de esta entrega\n\nLos declaramos en cada sección; los principales son:\n\n- **Una sola réplica.** El diseño permite varias réplicas por servicio, pero no lo probamos.\n- **Puertos de desarrollo.** El compose publica puertos que permiten saltearse el gateway; en un despliegue real se cerrarían.\n- **Pasarela simulada.** No se mueve dinero real.\n- **Cancelación sin plazos.** La política de cancelación todavía no los define.\n- **Fuera de alcance:** los bloqueos de fechas puntuales y la subida de fotos.\n\n## Trabajo futuro\n\n- Probar y medir el sistema con varias réplicas de cada servicio, y desplegarlo con un orquestador como Kubernetes, con autoescalado.\n- Reemplazar la pasarela simulada por Mercado Pago. Está aislada en un solo archivo, así que la saga no cambia.\n- Definir una política de cancelación con plazos y reembolsos parciales.\n- Sumar bloqueos de fechas puntuales y la subida de fotos a un almacenamiento de objetos compartido.\n- Un servicio de calificaciones que escuche los eventos de reserva, sin tocar los servicios existentes.\n- Una consulta de ocupación por lote entre Cocheras y Reservas, para búsquedas con mucho tráfico.\n- Propagar el contexto de traza completo en los eventos y sumar el gateway a las trazas, y mandar las alertas a un canal del equipo.\n- Apps nativas para iOS y Android sobre la misma API.\n\n## Sobre el uso de inteligencia artificial\n\nLa IA aceleró sobre todo la implementación, las pruebas y la documentación. El valor estuvo en usarla con un criterio claro: el contrato primero, la persona revisa y decide, y todo se verifica corriendo. Varias de las correcciones registradas en el anexo son casos en los que la IA propuso algo que parecía correcto y no lo era. Las decisiones de arquitectura y la elección entre alternativas fueron del equipo.\n\n## Cierre\n\nparkIN muestra que las características de los sistemas distribuidos se vuelven concretas cuando hay un problema real detrás:\n- **la concurrencia** es que una sola reserva gane;\n- **la tolerancia a fallos** es que un pago no se pierda si se cae un servicio;\n- **la confidencialidad** es que nadie más que quien reservó sepa dónde vive el propietario.\n\nEl sistema completo se levanta con un solo comando y cada una de esas garantías se puede demostrar en vivo.\n","# Referencias\n\n1. M. van Steen y A. S. Tanenbaum, *Distributed Systems*, 4.ª ed., 2023. Definición de sistema distribuido, objetivos de diseño, tipos de transparencia, estilos de arquitectura y coordinación.\n2. G. Coulouris, J. Dollimore, T. Kindberg y G. Blair, *Distributed Systems: Concepts and Design*, 5.ª ed., Addison-Wesley, 2012. Características de los sistemas distribuidos y técnicas de tolerancia a fallos.\n3. M. Kleppmann, *Designing Data-Intensive Applications*, O'Reilly, 2017. Modos de flujo de datos: a través de bases de datos, de llamadas a servicios y de paso de mensajes.\n4. A. Wiggins, *The Twelve-Factor App*, https://12factor.net/es/\n5. Amazon Web Services, *What is EDA? Event-Driven Architecture Explained*, https://aws.amazon.com/what-is/eda/\n6. Material del curso Sistemas Distribuidos, Universidad de Montevideo, 2026: temas 1 a 7 y clases prácticas de arquitectura, comunicación (REST, GraphQL, RabbitMQ y WebSockets) y observabilidad.\n7. C. Richardson, *Pattern: Saga* y *Pattern: Transactional outbox*, https://microservices.io/patterns/\n8. Documentación oficial de PostgreSQL 16 (restricciones de exclusión y *advisory locks*), PostGIS, RabbitMQ, Socket.IO, OpenTelemetry, Prometheus, Grafana Loki y Jaeger.\n9. Repositorio del proyecto: https://github.com/IgnacioIglesia/parkin\n","# Anexo: uso de inteligencia artificial\n\n## Cómo la usamos\n\nUsamos **Claude Code**, el asistente de programación de Anthropic, desde la terminal y sobre el repositorio del proyecto. Los cuatro integrantes lo usamos en nuestra parte.\n\n1. **Primero el contrato, después el código.** Los endpoints, los eventos y el esquema GraphQL quedaron escritos en `docs/contratos.md` antes de implementar. La IA implementó contra ese contrato y los cambios al contrato se discutieron en el equipo.\n2. **La IA escribe, la persona revisa y publica.** La IA crea código, pruebas y documentos; cada persona revisa el trabajo, lo publica con su usuario y responde por él. Por eso la IA no figura como autora de los commits: su uso queda declarado acá y en el registro detallado.\n3. **Se verifica corriendo, no leyendo.** Cada pieza se probó con pruebas automáticas contra bases de datos y un broker reales, y con recorridos de punta a punta por el gateway. Cuando una prueba falló, se corrigió la causa.\n4. **Una rama por tarea.** Cada cambio entró a la rama principal por una solicitud de integración (*pull request*) revisada.\n\n**Para qué la usamos:** implementar servicios sobre un contrato, escribir pruebas, reproducir y diagnosticar errores, revisar seguridad, armar la infraestructura y mantener la documentación al día.\n\n**Qué decidimos nosotros:** el reparto de servicios, la arquitectura, el stack y la elección entre alternativas. En esos casos la IA presentó las opciones con sus costos y el equipo eligió.\n\n**Límite que conocemos:** la IA puede producir código que parece correcto y no lo es. Varias de las filas de abajo son casos así, y por eso cada decisión indica qué se verificó y qué se cambió.\n\n## Veinte decisiones concretas\n\n| # | Integrante | Qué se consultó o se decidió | Qué se aceptó, se corrigió o se descartó |\n|---|---|---|---|\n| 1 | Ignacio | Dónde validar el JWT: en el gateway con la clave pública (njs) o consultando a Usuarios en cada pedido | Se eligió el gateway: no depende de Usuarios en cada pedido, como planteaba la segunda entrega. Se probó con 40 verificaciones, incluidos tokens vencidos, falsificados, `alg: none` y cambio de algoritmo. El equipo votó esa opción |\n| 2 | Ignacio | Cómo evitar la doble reserva: código de la aplicación o base de datos | Una restricción de exclusión en PostgreSQL, porque la regla tiene que vivir donde coinciden todas las réplicas. Con 100 clientes simultáneos entra una reserva y hay 99 conflictos; sin la restricción, la misma prueba falla |\n| 3 | Ignacio | Publicar el evento directamente después de guardar, o con un *outbox* transaccional | Se adoptó el *outbox* para no perder eventos si RabbitMQ cae. La prueba con RabbitMQ real mostró que la configuración no creaba el *virtual host* y se corrigió |\n| 4 | Ignacio | Reservas simultáneas respondían `500` en lugar de `409` (error reportado por Diego) | Se reprodujo con PostgreSQL 16: 34 de cada 600 intentos. Reintentar no alcanzaba (18 de 250 seguían fallando), así que se agregó un bloqueo por cochera. Después, 0 errores en 3000 intentos. Se rehízo la prueba para que detectara el problema |\n| 5 | Ignacio | Qué hacer con un pago que llega cuando la reserva ya venció | Reembolso automático, decidido por el equipo frente a otras alternativas |\n| 6 | Ignacio | Arranque desde cero en un clon limpio | Falló: el gateway y Pagos buscaban la clave pública antes de que existiera. Se agregó un servicio que genera las claves la primera vez y los demás esperan. Se sumó reinicio automático a las bases y a RabbitMQ |\n| 7 | Ignacio | Mostrar el sistema desde otro dispositivo con un túnel público | Decisión de seguridad: publicar solo la página de pago de la pasarela de prueba y no el resto de sus rutas |\n| 8 | Romina | Contrato de Pagos: endpoint, webhook firmado, eventos | Se adoptó, pero los datos de los eventos se alinearon con los que Reservas ya publicaba en vez de la propuesta inicial |\n| 9 | Romina | Implementación propia de Pagos, hecha en paralelo | Se descartó porque quedó duplicada con la que ya estaba integrada. Lo aprendido sirvió para verificar la otra y para detectar que la traza de la saga se cortaba en el webhook, que se resolvió guardando el identificador de traza con el pago |\n| 10 | Romina | Métricas propias del gateway y nivel de sus logs de error | Al probarlo se vio que el log de errores no registraba los tokens rechazados y se corrigió. Se descartó una alerta de errores 5xx porque la fuente de métricas no los separa por código |\n| 11 | Romina | Cerrar el puerto propio de Pagos | Se verificó que nada lo usaba y que todo sigue entrando por el gateway, con la prueba de punta a punta en verde |\n| 12 | Romina | Revisión de la sección de Pagos | Se verificó cada punto contra el código. Se corrigió la cantidad de pruebas (60, no 61): un archivo de ayuda se contaba como prueba |\n| 13 | Martina | Sesiones con renovación rotativa del token | Al probar la web apareció un error: recargar durante una renovación cerraba todas las sesiones. Se agregó una ventana de gracia de 30 segundos y se probó que la detección de robo sigue funcionando fuera de ella |\n| 14 | Martina | Dirección visual de la web | La IA propuso varias; se eligió una y un segundo agente la revisó. Se aplicaron las 7 correcciones |\n| 15 | Martina | Qué hacer con el endpoint de verificación de Usuarios, que dejó de usarse | La IA presentó dejarlo o borrarlo; se borró, y sus pruebas se pasaron a otro endpoint para no perder cobertura |\n| 16 | Martina | Prueba de la web en un navegador real contra el sistema desde cero | Aparecieron dos detalles que se corrigieron: un pago rechazado mostraba dos avisos y la hora quedaba cortada en la barra |\n| 17 | Diego | Ubicación de las cocheras en el mapa | Ubicación aproximada fija, desplazada 100 a 300 m de la real. Si Reservas no responde, la búsqueda sigue sin filtrar ocupación, pero la baja de una cochera se rechaza |\n| 18 | Diego | Bloqueos de fechas puntuales y fotos | La IA presentó implementarlos o declararlos fuera de alcance, con el costo de cada opción; se eligió declararlos como límite. La IA había propuesto «pausar la cochera» como alternativa, pero ese campo no existe en el contrato, y se corrigió el texto |\n| 19 | Diego | Secciones de Tecnologías y Observabilidad | Se verificaron versiones y dependencias contra el código. Los motivos de RabbitMQ frente a Kafka y de PostgreSQL frente a NoSQL los redactó la IA y quedaron para que el equipo los confirme. Se corrigió una afirmación que decía más de lo que se había medido |\n| 20 | Diego | Guion de defensa de Cocheras | Al verificarlo contra el código se corrigió qué representa el círculo del mapa (el radio de búsqueda, no la ubicación aproximada) y por qué el gateway no exporta tramos de traza |\n"]</script>
<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';

const secciones = JSON.parse(document.getElementById('secciones').textContent);
const cuerpo = document.getElementById('cuerpo');
secciones.forEach((md, i) => {
  const s = document.createElement('section');
  s.className = 'seccion' + (/^# (Referencias|Anexo)/.test(md) ? ' sin-numero' : '') + (/^# Anexo/.test(md) ? ' anexo' : '');
  s.innerHTML = marked.parse(md);
  s.querySelectorAll('h1, h2').forEach((h, j) => {
    h.textContent = h.textContent.replace(/^\d+\.\s+/, '');
    h.id = 's' + i + '-' + j;
  });
  // El texto alternativo de cada captura se muestra como leyenda debajo.
  // Cada imagen va en una figura con su leyenda, para que no queden en páginas distintas.
  s.querySelectorAll('img').forEach((img) => {
    const figura = document.createElement('div');
    figura.className = 'figura';
    img.replaceWith(figura);
    figura.append(img);
    if (!img.alt) return;
    const leyenda = document.createElement('div');
    leyenda.className = 'leyenda';
    leyenda.textContent = img.alt;
    figura.append(leyenda);
  });
  s.querySelectorAll('pre code.language-mermaid').forEach((c) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
  cuerpo.append(s);
});

const indice = document.getElementById('lista-indice');
let n = 0;
document.querySelectorAll('.seccion').forEach((s) => {
  const h1 = s.querySelector('h1');
  const numerada = !s.classList.contains('sin-numero');
  if (numerada) n++;
  const li = document.createElement('li');
  li.innerHTML = '<a href="#' + h1.id + '">' + (numerada ? n + '. ' : '') + h1.textContent + '</a>';
  const subs = [...s.querySelectorAll(':scope > h2')];
  if (numerada && subs.length) {
    const ol = document.createElement('ol');
    subs.forEach((h2, k) => {
      ol.insertAdjacentHTML('beforeend', '<li><a href="#' + h2.id + '">' + n + '.' + (k + 1) + ' ' + h2.textContent + '</a></li>');
    });
    li.append(ol);
  }
  indice.append(li);
});

// De a uno y con id propio: dibujados juntos, los nodos de un diagrama se mezclaban con los de otro.
mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { htmlLabels: false } });
let numero = 0;
for (const div of document.querySelectorAll('.mermaid')) {
  const { svg } = await mermaid.render('diagrama-' + numero++, div.textContent);
  div.innerHTML = svg;
}
await Promise.all([...document.images].map((img) => img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; })));
document.title = 'listo';
</script>
