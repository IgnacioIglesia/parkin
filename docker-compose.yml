# Entorno local completo. Las credenciales son solo para desarrollo.
#
#   docker compose up --build                      servicios listos + infraestructura
#   docker compose --profile pendiente up --build  incluye también los servicios sin código aún
#
# Un servicio con `profiles: ["pendiente"]` no tiene código todavía. Cuando su responsable
# lo mergea a main, borra esa línea y pasa a levantar con el resto.
services:
  # Todos los servicios (menos jwt-claves, que corre una vez) tienen restart: unless-stopped: si Docker o la
  # Mac se reinician, vuelven solos, bases de datos y RabbitMQ incluidos.
  gateway:
    build: ./gateway
    # Solo la clave pública (verifica los JWT). La privada no debe estar en el gateway.
    # Se genera con infra/jwt/generar-claves.sh.
    volumes: ["./infra/jwt/jwt_public.pem:/etc/nginx/jwt_public.pem:ro"]
    # Tiene que esperar a que jwt-claves genere la clave: si el archivo todavía no existe cuando
    # Docker crea el contenedor, lo crea como CARPETA y el arranque en frío falla.
    depends_on:
      jwt-claves: { condition: service_completed_successfully }
    ports: ["8080:80"]
    restart: unless-stopped

  # Traduce los contadores de NGINX (stub_status, puerto interno 8088 del gateway) al formato de
  # Prometheus. No publica puertos: Prometheus lo lee por la red de Docker.
  gateway-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://gateway:8088/stub_status"]
    depends_on: [gateway]
    restart: unless-stopped

  # Genera las claves JWT en infra/jwt si faltan y termina: así `docker compose up` funciona
  # desde cero. Usa la misma imagen que Usuarios. Corre como root para poder escribir en la
  # carpeta montada del host también en Linux y macOS.
  jwt-claves:
    build: ./usuarios
    image: parkin-usuarios
    user: root
    command: ["node", "src/generar-claves.js", "/claves"]
    volumes: ["./infra/jwt:/claves"]
    restart: "no"

  usuarios:
    build: ./usuarios
    image: parkin-usuarios
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://app:app@db-usuarios:5432/usuarios
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: usuarios
    volumes: ["./infra/jwt:/run/secrets:ro"]  # las genera jwt-claves si faltan
    ports: ["3001:3000"]
    depends_on:
      db-usuarios: { condition: service_healthy }
      jwt-claves: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: ./web
    ports: ["8081:80"]  # http://localhost:8081: la web, que habla con el gateway
    depends_on: [gateway]
    restart: unless-stopped

  cocheras:
    build: ./cocheras
    environment:
      DATABASE_URL: postgres://app:app@db-cocheras:5432/cocheras
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RESERVAS_URL: http://reservas:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: cocheras
    ports: ["4000:4000"]
    depends_on:
      db-cocheras: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  reservas:
    build: ./reservas
    environment:
      DATABASE_URL: postgres://app:app@db-reservas:5432/reservas
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RETENCION_MINUTOS: "10"
      COCHERAS_URL: http://cocheras:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: reservas
    ports: ["8000:8000"]
    depends_on:
      db-reservas: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  pagos:
    build: ./pagos
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://app:app@db-pagos:5432/pagos
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_PATH: /etc/pagos/jwt_public.pem
      PASARELA_URL: http://pasarela-mock:8090
      PASARELA_WEBHOOK_SECRET: ${PASARELA_WEBHOOK_SECRET:-secreto-de-desarrollo}
      PAGOS_WEBHOOK_URL: http://pagos:3000/pagos/webhook
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: pagos
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Solo la clave pública (verifica los JWT). Se genera con infra/jwt/generar-claves.sh.
    volumes: ["./infra/jwt/jwt_public.pem:/etc/pagos/jwt_public.pem:ro"]
    # Sin puerto en el host: todo entra por el gateway (/api/pagos, /api/pagos/webhook y /ws).
    depends_on:
      jwt-claves: { condition: service_completed_successfully }
      db-pagos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Pasarela de pagos de mentira (imita a Mercado Pago) para la demo. La checkoutUrl que ve el
  # navegador sale de PASARELA_PUBLIC_URL: con un túnel, poné la URL pública del gateway + /pasarela.
  pasarela-mock:
    build: ./pasarela-mock
    environment:
      PORT: "8090"
      PASARELA_WEBHOOK_SECRET: ${PASARELA_WEBHOOK_SECRET:-secreto-de-desarrollo}
      PASARELA_PUBLIC_URL: ${PASARELA_PUBLIC_URL:-http://localhost:8090}
    ports: ["8090:8090"]
    restart: unless-stopped

  db-usuarios:
    restart: unless-stopped
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: usuarios }
    ports: ["5441:5432"]
    volumes: ["pg-usuarios:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-cocheras:
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: cocheras }
    ports: ["5442:5432"]
    volumes: ["pg-cocheras:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cocheras"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-reservas:
    restart: unless-stopped
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: reservas }
    ports: ["5443:5432"]
    volumes: ["pg-reservas:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-pagos:
    restart: unless-stopped
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: pagos }
    ports: ["5444:5432"]
    volumes: ["pg-pagos:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pagos"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    # Exchange, colas y bindings se crean al arrancar (ver docs/contratos.md, sección 7).
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports: ["9090:9090"]

  loki:
    restart: unless-stopped
    image: grafana/loki:3.1.0
    ports: ["3100:3100"]

  # Lee los logs de todos los contenedores y los manda a Loki (ver infra/alloy/config.alloy).
  alloy:
    restart: unless-stopped
    image: grafana/alloy:v1.19.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  # Recibe trazas OTLP por HTTP en el 4318 (OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318).
  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:1.58
    ports: ["16686:16686", "4318:4318"]

  # Datasources y dashboard se cargan solos (infra/grafana). Acceso anónimo: solo desarrollo.
  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/parkin.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3030:3000"]  # 3030 y no 3000, que suele estar ocupado por servidores de desarrollo
    depends_on: [prometheus, loki, jaeger]

volumes:
  pg-usuarios:
  pg-cocheras:
  pg-reservas:
  pg-pagos:
