worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker. Con los upstreams en variables, nginx resuelve el nombre en cada
    # request: arranca aunque algún servicio todavía no esté levantado (responde 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Si el cliente no manda traceparent (W3C), el gateway genera el traceId.
    map $http_traceparent $traceparent {
        default $http_traceparent;
        ""      "00-$request_id-0000000000000001-01";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;

        limit_req zone=general burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header traceparent $traceparent;
        # TODO (gateway): validar el JWT (RS256, clave pública de Usuarios) y poner acá el
        # id del usuario. Mientras tanto se descarta el valor que mande el cliente, para que
        # nadie pueda hacerse pasar por otro usuario con un header falso.
        proxy_set_header X-User-Id "";
        add_header X-Trace-Id $request_id always;

        location = /health {
            default_type text/plain;
            return 200 "ok";
        }

        # /api/usuarios/auth/login -> usuarios:/auth/login (se quita el prefijo)
        location /api/usuarios/ {
            set $upstream http://usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # 10 intentos de login por minuto por IP
        location = /api/usuarios/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $upstream http://usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # /api/reservas/{id} -> reservas:/reservas/{id}
        location /api/reservas {
            set $upstream http://reservas:8000;
            rewrite ^/api/reservas(.*)$ /reservas$1 break;
            proxy_pass $upstream;
        }

        # /api/pagos/webhook -> pagos:/pagos/webhook
        location /api/pagos {
            set $upstream http://pagos:3000;
            rewrite ^/api/pagos(.*)$ /pagos$1 break;
            proxy_pass $upstream;
        }

        location /graphql {
            set $upstream http://cocheras:4000;
            proxy_pass $upstream;
        }

        # Socket.IO sobre WebSocket
        location /ws {
            set $upstream http://pagos:3000;
            proxy_pass $upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header traceparent $traceparent;
            proxy_set_header X-User-Id "";
            proxy_read_timeout 3600s;
        }
    }
}
