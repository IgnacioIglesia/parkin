load_module modules/ngx_http_js_module.so;

# Se declara para que jwt.js pueda leer JWT_ISSUER (por defecto, el mismo que Usuarios).
env JWT_ISSUER;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    js_import jwt from /etc/nginx/jwt.js;

    # DNS interno de Docker. Con los upstreams en variables, nginx resuelve el nombre en cada
    # request: arranca aunque algún servicio todavía no esté levantado (responde 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Si el cliente no manda traceparent (W3C), el gateway genera el traceId.
    map $http_traceparent $traceparent {
        default $http_traceparent;
        ""      "00-$request_id-0000000000000001-01";
    }

    # traceId (32 hex) del traceparent, para devolverlo en X-Trace-Id.
    map $traceparent $trace_id {
        default                                   $request_id;
        "~^00-(?<traza>[0-9a-f]{32})-[0-9a-f]{16}-" $traza;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # CORS: el navegador solo deja que el front llame al gateway si el origen está permitido.
    # Se permiten los despliegues de Vercel (*.vercel.app) y el front en desarrollo local.
    # Para sumar otro dominio (por ejemplo uno propio), agregar una línea con su expresión.
    map $http_origin $origen_permitido {
        default                                  "";
        "~^https://[a-z0-9-]+\.vercel\.app$"     $http_origin;
        "~^http://localhost:[0-9]+$"             $http_origin;
        "~^http://127\.0\.0\.1:[0-9]+$"         $http_origin;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;

        limit_req zone=general burst=40 nodelay;

        proxy_http_version 1.1;
        add_header X-Trace-Id $trace_id always;

        # Si algún servicio llegara a mandar sus propios headers de CORS, se descartan para que
        # no lleguen duplicados al navegador (el gateway es el único que decide).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header X-Trace-Id;  # el gateway lo manda una sola vez

        # Con origen no permitido el valor queda vacío y nginx no agrega el header.
        add_header Access-Control-Allow-Origin $origen_permitido always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, traceparent" always;
        add_header Access-Control-Expose-Headers "X-Trace-Id" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        # Preflight: el navegador pregunta con OPTIONS antes de un POST con JSON o con
        # Authorization. Se responde acá, antes de pedir el token, sin molestar a los servicios.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Cuando falla la validación del JWT (ver jwt.js).
        error_page 401 = @no_autenticado;
        # auth_request convierte en 500 cualquier fallo del validador (p. ej. sin clave pública).
        error_page 500 = @auth_no_disponible;

        location @no_autenticado {
            default_type application/json;
            add_header WWW-Authenticate "Bearer" always;
            add_header Access-Control-Allow-Origin $origen_permitido always;
            add_header Access-Control-Expose-Headers "X-Trace-Id" always;
            add_header X-Trace-Id $trace_id always;
            add_header Vary Origin always;
            return 401 '{"codigo":"NO_AUTENTICADO","mensaje":"Falta el token de acceso o es inválido o está vencido"}';
        }

        location @auth_no_disponible {
            default_type application/json;
            add_header Access-Control-Allow-Origin $origen_permitido always;
            add_header X-Trace-Id $trace_id always;
            add_header Vary Origin always;
            return 503 '{"codigo":"AUTH_NO_DISPONIBLE","mensaje":"El gateway no puede validar tokens en este momento"}';
        }

        # Validadores de JWT: solo los usa auth_request (no son accesibles desde afuera).
        location = /_jwt_obligatorio {
            internal;
            js_content jwt.obligatorio;
        }

        location = /_jwt_opcional {
            internal;
            js_content jwt.opcional;
        }

        location = /health {
            default_type text/plain;
            return 200 "ok";
        }

        # --- Usuarios --------------------------------------------------------------------
        # Registro, login y refresh son públicos: ahí todavía no hay token.
        # 10 intentos de login por minuto por IP.
        location = /api/usuarios/auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # /api/usuarios/auth/register -> usuarios:/auth/register (se quita el prefijo)
        location /api/usuarios/auth/ {
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        location /api/usuarios/.well-known/ {
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # El resto (perfil, etc.) exige token.
        location /api/usuarios/ {
            include /etc/nginx/snippets/jwt-obligatorio.conf;
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass $upstream;
        }

        # --- Reservas: siempre con token -------------------------------------------------
        # /api/reservas/{id} -> reservas:/reservas/{id}
        location /api/reservas {
            include /etc/nginx/snippets/jwt-obligatorio.conf;
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://reservas:8000;
            rewrite ^/api/reservas(.*)$ /reservas$1 break;
            proxy_pass $upstream;
        }

        # --- Pagos -----------------------------------------------------------------------
        # El webhook lo llama la pasarela, no una persona: no lleva JWT sino una firma HMAC
        # que verifica el propio servicio de Pagos.
        location /api/pagos/webhook {
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://pagos:3000;
            rewrite ^/api/pagos(.*)$ /pagos$1 break;
            proxy_pass $upstream;
        }

        location /api/pagos {
            include /etc/nginx/snippets/jwt-obligatorio.conf;
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://pagos:3000;
            rewrite ^/api/pagos(.*)$ /pagos$1 break;
            proxy_pass $upstream;
        }

        # --- Cocheras (GraphQL) ----------------------------------------------------------
        # Buscar cocheras puede hacerlo cualquiera; crear o editar exige el rol, que el propio
        # servicio comprueba con X-User-Roles. Sin token la request sigue anónima.
        location /graphql {
            include /etc/nginx/snippets/jwt-opcional.conf;
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://cocheras:4000;
            proxy_pass $upstream;
        }

        # Socket.IO sobre WebSocket. El token viaja en el handshake (auth.token), no en un
        # header, así que lo valida el servicio de Pagos al conectar.
        location /ws {
            include /etc/nginx/snippets/proxy.conf;
            set $upstream http://pagos:3000;
            proxy_pass $upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
